name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================================
  # 1. Code Quality & Syntax Validation (Fast: ~5 seconds)
  # ============================================================================
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Syntax & Error Checks
        run: |
          ruff check app/ ui/ --select E9,F63,F7,F82

      - name: Validate Python Bytecode Compilation
        run: |
          python -m compileall app/ ui/

  # ============================================================================
  # 2. Docker Build & Layer Verification
  # ============================================================================
  docker-build-verification:
    needs: lint-and-validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build FastAPI Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: false
          tags: rag-backend:ci-test

      - name: Build Streamlit UI Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ui
          push: false
          tags: rag-ui:ci-test
