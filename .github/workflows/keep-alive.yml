name: Keep App Alive 24/7

on:
  schedule:
    # Runs every 14 minutes to prevent Render 15-minute idle sleep and keep instances hot 24/7
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Production Endpoints
        run: |
          python3 -c "
          import urllib.request
          import ssl

          ctx = ssl.create_default_context()
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36'
          }
          urls = [
              'https://enterprise-agentic-rag-kubernetes.onrender.com',
              'https://enterprise-agentic-rag-kubernetes.onrender.com/health',
              'https://enterprise-agentic-rag-kubernetes.onrender.com/_stcore/health',
              'https://enterprise-agentic-rag-kubernetes.streamlit.app'
          ]
          for u in urls:
              try:
                  req = urllib.request.Request(u, headers=headers)
                  with urllib.request.urlopen(req, timeout=25, context=ctx) as res:
                      print(f'[SUCCESS] Ping {u} -> Status {res.status}')
              except Exception as e:
                  print(f'[NOTICE] Ping {u}: {e}')
          "

